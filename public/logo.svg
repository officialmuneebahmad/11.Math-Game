<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#4c1d95"/>
    </linearGradient>
    <linearGradient id="brainGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="mathGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>

  <!-- Center divider line -->
  <line x1="32" y1="10" x2="32" y2="54" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>

  <!-- Brain (left side) - stylized hemisphere -->
  <g filter="url(#glow)" stroke="url(#brainGrad)" stroke-width="2" stroke-linecap="round" fill="none">
    <!-- Main brain outline left -->
    <path d="M28 14 C20 14, 14 20, 14 28 C14 32, 16 35, 18 37 C16 39, 15 42, 17 45 C19 48, 23 49, 27 48 L30 48 L30 14 Z" fill="url(#brainGrad)" fill-opacity="0.15"/>
    <!-- Brain folds -->
    <path d="M14 26 C16 24, 19 25, 20 27"/>
    <path d="M14 33 C17 31, 21 32, 22 35"/>
    <path d="M17 40 C20 38, 24 39, 25 42"/>
    <!-- Neuron dots -->
    <circle cx="18" cy="22" r="1.5" fill="#60a5fa"/>
    <circle cx="24" cy="30" r="1.5" fill="#818cf8"/>
    <circle cx="20" cy="41" r="1.5" fill="#60a5fa"/>
  </g>

  <!-- Math symbols (right side) -->
  <g filter="url(#glow)" fill="url(#mathGrad)" font-family="serif" font-weight="bold">
    <!-- Plus -->
    <rect x="34" y="16" width="10" height="2.5" rx="1"/>
    <rect x="38.25" y="12" width="2.5" height="10" rx="1"/>
    <!-- Minus -->
    <rect x="34" y="30" width="10" height="2.5" rx="1"/>
    <!-- Multiply X -->
    <rect x="34" y="42" width="11" height="2.5" rx="1" transform="rotate(45 39.5 43.25)"/>
    <rect x="34" y="42" width="11" height="2.5" rx="1" transform="rotate(-45 39.5 43.25)"/>
  </g>
</svg>